
name: Aphrody FUTBIN Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Bun installieren
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Abhängigkeiten installieren
        run: |
          npm init -y
          npm install @aphrody/fut @aphrody/bxc tsx

      - name: FUTBIN testen
        run: |
          npx tsx aphrody_test.js
