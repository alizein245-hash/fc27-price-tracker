
name: Aphrody FUTBIN Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Bun einrichten
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Pakete installieren
        run: |
          bun init -y
          bun add @aphrody/fut @aphrody/bxc

      - name: Installierte Pakete prüfen
        run: |
          bun pm ls

      - name: FUTBIN testen
        run: |
          bun run aphrody_test.js
