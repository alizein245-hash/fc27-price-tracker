
name: FUTBIN CLI Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: cli-web-futbin installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install cli-web-futbin

      - name: FUTBIN Barcola testen
        run: |
          echo "=============================================="
          echo "FUTBIN CLI TEST"
          echo "=============================================="
          echo "Spieler: Bradley Barcola"
          echo "FC Jahr: 27"
          echo "Plattform: PlayStation"
          echo

          cli-web-futbin players search \
            --name "Bradley Barcola" \
            --year 27 \
            --json
