
name: FUTBIN SDK Test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: FUTBIN SDK installieren
        run: |
          python -m pip install --upgrade pip
          python -m pip install git+https://github.com/daojiAnime/futbin-sdk.git

      - name: Barcola testen
        run: |
          python - <<'PY'
          import asyncio
          from futbin_sdk import FutbinClient

          async def main():
              print("=" * 70)
              print("FUTBIN SDK TEST")
              print("=" * 70)
              print("Spieler: Bradley Barcola")
              print("FUTBIN ID: 21977")
              print("Plattform: PlayStation")
              print()

              client = FutbinClient()

              try:
                  result = await client.get_player_price(
                      player_id=21977,
                      platform="PS"
                  )

                  print("ROHES ERGEBNIS:")
                  print(result)

              except Exception as e:
                  print("FEHLER:")
                  print(type(e).__name__)
                  print(str(e))
                  raise

          asyncio.run(main())
          PY

